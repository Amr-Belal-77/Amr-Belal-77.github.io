  <body>
    <div id="root"></div>
    <script>
      (function (location) {
        if (location.search.startsWith('?/')) {
          const restoredPath = location.search
            .slice(2)
            .split('&')
            .map((part) => part.replace(/~and~/g, '&'))
            .join('?');

          window.history.replaceState(null, '', `/${restoredPath}${location.hash}`);
        }
      })(window.location);
    </script>
